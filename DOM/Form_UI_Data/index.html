<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User CRUD App</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-red-900 via-black to-black text-white">

    <div class="container mx-auto px-4 py-10">

        <!-- Heading -->
        <div class="text-center mb-10">
            <h1 class="text-4xl md:text-5xl font-bold mb-3">
                User Management
            </h1>
            <p class="text-gray-400">
                Add, Edit and Delete Users using JavaScript DOM
            </p>
        </div>

        <!-- Form Card -->
        <div class="max-w-2xl mx-auto">
            <div
                class="bg-white/10 backdrop-blur-lg border border-white/10 rounded-3xl p-8 shadow-2xl"
            >
                <h2 class="text-2xl font-semibold mb-6">
                    Create User
                </h2>

                <form id="userForm" class="space-y-5">

                    <!-- Name -->
                    <div>
                        <label
                            for="name"
                            class="block text-sm font-medium mb-2 text-gray-300"
                        >
                            Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your name"
                            class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30 transition"
                        />
                    </div>

                    <!-- Email -->
                    <div>
                        <label
                            for="email"
                            class="block text-sm font-medium mb-2 text-gray-300"
                        >
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30 transition"
                        />
                    </div>

                    <!-- Image URL -->
                    <div>
                        <label
                            for="imageUrl"
                            class="block text-sm font-medium mb-2 text-gray-300"
                        >
                            Image URL
                        </label>

                        <input
                            type="url"
                            id="imageUrl"
                            placeholder="https://example.com/image.jpg"
                            class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30 transition"
                        />
                    </div>

                    <!-- Submit Button -->
                    <button
                        type="submit"
                        id="submitBtn"
                        class="w-full bg-blue-600 hover:bg-blue-700 py-3 rounded-xl font-semibold transition duration-300 shadow-lg"
                    >
                        Add User
                    </button>

                </form>
            </div>
        </div>

        <!-- Users Section -->
        <div class="mt-16">

            <div class="flex items-center justify-between mb-8">
                <h2 class="text-3xl font-bold">
                    Users List
                </h2>

                <span
                    id="userCount"
                    class="bg-blue-600 px-4 py-2 rounded-full text-sm font-medium"
                >
                    0 Users
                </span>
            </div>

            <!-- Cards Container -->
            <div
                id="usersContainer"
                class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
            >

                <!-- JS will render cards here -->

            </div>

        </div>

    </div>

    <script src="./script.js"></script>
</body>
</html>
