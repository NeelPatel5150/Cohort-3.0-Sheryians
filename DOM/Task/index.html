<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">

    <h1>Task Manager</h1>

    <div class="top-section">
      <input
        type="text"
        id="taskInput"
        placeholder="Enter task..."
        value="Learn JavaScript"
      />

      <button id="addBtn">Add Task</button>

      <button id="themeBtn">🌙 Theme</button>
    </div>

    <div class="task-info">
      <p>Total Tasks: <span id="total">0</span></p>
      <p>Completed: <span id="completed">0</span></p>
      <p>Pending: <span id="pending">0</span></p>
    </div>

    <div id="taskContainer"></div>

    <hr>

    <h2>Attributes vs Properties</h2>

    <button id="attributeBtn">
      Check Console
    </button>

    <hr>

    <h2>Browser Rendering Pipeline</h2>

    <div class="pipeline">
      <div>HTML</div>
      <div>Parsing</div>
      <div>DOM Tree</div>
      <div>CSS</div>
      <div>CSSOM Tree</div>
      <div>Render Tree</div>
      <div>Layout</div>
      <div>Paint</div>
    </div>

    <hr>

    <h2>Event Propagation Demo</h2>

    <div id="grand">
      Grand Parent

      <div id="parent">
        Parent

        <button id="child">
          Click Me
        </button>

      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
