<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <main class="app-shell">
        <div class="card">
            <p class="eyebrow">Simple Planner</p>
            <h1>Todo List</h1>
            <p class="subtitle">Add tasks, edit them, and clear what you finish.</p>

            <form class="todo-form">
                <input type="text" placeholder="Task write here..." aria-label="Todo task" />
                <button type="submit">Add</button>
            </form>

            <div class="todo-list"></div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
