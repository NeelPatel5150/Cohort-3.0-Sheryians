<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>FinTrack Pro</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<section id="authWrap" class="auth-wrap">
		<div class="auth-card">
			<h1>FinTrack Pro</h1>
			<p class="auth-sub">Simple login for demo session</p>

			<div class="auth-tabs">
				<button id="loginTab" class="btn small-btn active" type="button">Login</button>
				<button id="registerTab" class="btn ghost small-btn" type="button">Register</button>
			</div>

			<form id="loginForm">
				<label for="loginEmail">Email</label>
				<input type="email" id="loginEmail" required>

				<label for="loginPass">Password</label>
				<input type="password" id="loginPass" required>

				<button class="btn" type="submit">Login</button>
			</form>

			<form id="registerForm" class="hidden">
				<label for="regName">Display Name</label>
				<input type="text" id="regName" required>

				<label for="regEmail">Email</label>
				<input type="email" id="regEmail" required>

				<label for="regPass">Password</label>
				<input type="password" id="regPass" required>

				<label for="regPass2">Confirm Password</label>
				<input type="password" id="regPass2" required>

				<button class="btn" type="submit">Create Account</button>
			</form>
		</div>
	</section>

	<div id="appWrap" class="hidden">
		<header class="topbar">
			<div class="brand-box">
				<h1>FinTrack Pro</h1>
				<p id="helloName">Welcome</p>
			</div>

			<nav class="top-nav">
				<button id="goDash" class="nav-btn active" type="button">Dashboard</button>
				<button id="goSettings" class="nav-btn" type="button">Settings</button>
			</nav>

			<div class="top-actions">
				<button id="openAdd" class="btn" type="button">Add Transaction</button>
				<button id="logoutBtn" class="btn ghost" type="button">Logout</button>
			</div>
		</header>

		<main>
			<section id="dashPage" class="page">
				<div class="summary-grid">
					<div class="mini card-item">
						<span>Current Balance</span>
						<strong id="balance">0</strong>
					</div>
					<div class="mini card-item">
						<span>Total Income</span>
						<strong id="income">0</strong>
					</div>
					<div class="mini card-item">
						<span>Total Expense</span>
						<strong id="expense">0</strong>
					</div>
					<div class="mini card-item">
						<span>Total Transactions</span>
						<strong id="txCount">0</strong>
					</div>
				</div>

				<div class="card">
					<h2>Cash Flow</h2>
					<canvas id="chart" height="140"></canvas>
				</div>

				<div class="card">
					<div class="filters-top">
						<button id="allBtn" class="chip active" type="button">All Types</button>
						<button id="incBtn" class="chip" type="button">Income Only</button>
						<button id="expBtn" class="chip" type="button">Expense Only</button>
					</div>

					<div class="filters">
						<input type="text" id="search" placeholder="Search description">
						<select id="filterMonth">
							<option value="all">All Months</option>
						</select>
						<button id="clearFilter" class="btn ghost" type="button">Clear Filters</button>
					</div>

					<div class="table-wrap">
						<table>
							<thead>
								<tr>
									<th>Date</th>
									<th>Description</th>
									<th>Category</th>
									<th>Amount</th>
									<th>Action</th>
								</tr>
							</thead>
							<tbody id="tbody"></tbody>
						</table>
					</div>
					<p id="emptyText" class="empty">No transaction found.</p>
				</div>
			</section>

			<section id="settingsPage" class="page hidden">
				<div class="card settings-card">
					<h2>Profile Settings</h2>

					<label for="profileName">Display Name</label>
					<input type="text" id="profileName" placeholder="Your name">

					<label for="currency">Currency</label>
					<select id="currency">
						<option value="USD">USD</option>
						<option value="EUR">EUR</option>
						<option value="GBP">GBP</option>
						<option value="INR">INR</option>
						<option value="JPY">JPY</option>
					</select>

					<label class="switch-line" for="darkToggle">
						<input type="checkbox" id="darkToggle">
						<span>Dark Mode</span>
					</label>

					<div class="settings-btns">
						<button id="saveProfile" class="btn" type="button">Save Profile</button>
						<button id="clearData" class="btn danger" type="button">Reset All Data</button>
					</div>
				</div>
			</section>
		</main>
	</div>

	<div id="txModal" class="modal hidden">
		<div id="modalInner" class="modal-inner">
			<div class="modal-head">
				<h2 id="modalTitle">Add Transaction</h2>
				<button id="closeModal" class="close-btn" type="button">x</button>
			</div>

			<form id="txForm">
				<input type="hidden" id="editId">

				<label for="type">Type</label>
				<select id="type" required>
					<option value="income">Income</option>
					<option value="expense">Expense</option>
				</select>

				<label for="note">Description</label>
				<input type="text" id="note" placeholder="Salary, groceries" required>

				<label for="amount">Amount</label>
				<input type="number" id="amount" step="0.01" required>

				<label for="date">Date</label>
				<input type="date" id="date" required>

				<label for="category">Category</label>
				<select id="category" required>
					<option>Food & Dining</option>
					<option>Shopping</option>
					<option>Recharge & Bills</option>
					<option>Petrol & Auto</option>
					<option>Utilities</option>
					<option>Salary</option>
					<option>Entertainment</option>
					<option>Other</option>
				</select>

				<div class="form-buttons">
					<button type="submit" id="saveBtn" class="btn">Save</button>
					<button type="button" id="cancelEdit" class="btn ghost">Cancel</button>
				</div>
			</form>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
	<script src="script.js"></script>
</body>
</html>
