<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Jon Daniel – Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #f0ede8;
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
  }

  /* ── OUTER WRAPPER ── */
  .wrapper {
    width: 100%;
    max-width: 1060px;
  }

  /* ── MAIN GRID ── */
  .grid {
    display: grid;
    grid-template-columns: 260px 1fr 220px;
    grid-template-rows: auto auto;
    gap: 14px;
  }

  /* ─────────────────────────────────────
     CARD 1  –  About Me / Profile (left)
     ───────────────────────────────────── */
  .card-profile {
    grid-column: 1;
    grid-row: 1 / 3;
    background: #b8a9f8;
    border-radius: 24px;
    padding: 22px 22px 24px;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    min-height: 480px;
  }

  .card-profile .tag {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    color: #1a1a1a;
    letter-spacing: 0.02em;
    margin-bottom: 18px;
  }
  .card-profile .tag svg { width: 14px; height: 14px; }

  /* Photo circle */
  .photo-wrap {
    position: relative;
    width: 180px;
    height: 180px;
    margin: 0 auto 16px;
  }
  .photo-circle {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    background: #e5d8ff;
    overflow: hidden;
    position: relative;
  }
  /* Greyscale person silhouette via CSS */
  .photo-circle .person {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 140px;
    height: 170px;
    background: #888;
    border-radius: 70px 70px 0 0;
    overflow: hidden;
  }
  .photo-circle .head {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 70px;
    height: 75px;
    background: #aaa;
    border-radius: 50% 50% 45% 45%;
  }
  /* glasses */
  .photo-circle .glasses {
    position: absolute;
    top: 36px;
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 16px;
  }
  .photo-circle .glasses::before,
  .photo-circle .glasses::after {
    content: '';
    position: absolute;
    top: 0;
    width: 26px; height: 16px;
    border: 2.5px solid #555;
    border-radius: 6px;
  }
  .photo-circle .glasses::before { left: 0; }
  .photo-circle .glasses::after  { right: 0; }

  /* Pink glow dot */
  .photo-wrap::after {
    content: '';
    position: absolute;
    bottom: 2px; right: 2px;
    width: 40px; height: 40px;
    background: radial-gradient(circle at 40% 40%, #ff6fd8, #f06);
    border-radius: 50%;
    border: 3px solid #b8a9f8;
  }

  .card-profile .name {
    font-family: 'Syne', sans-serif;
    font-size: 36px;
    font-weight: 800;
    color: #1a1a1a;
    line-height: 1.1;
    margin-top: auto;
  }
  .card-profile .name span { display: block; }
  .card-profile .greeting {
    font-size: 15px;
    font-weight: 500;
    color: #1a1a1a;
    margin-bottom: 4px;
  }

  .card-profile .email-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 20px;
    font-size: 11px;
    color: #1a1a1a;
    font-weight: 500;
  }
  .card-profile .email-row svg { width: 14px; height: 14px; flex-shrink: 0; }

  /* rotating badge */
  .badge-ring {
    position: absolute;
    bottom: 22px;
    right: 18px;
    width: 60px;
    height: 60px;
  }
  .badge-ring svg {
    width: 100%;
    height: 100%;
    animation: spin 12s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .badge-ring .center-dot {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    width: 18px; height: 18px;
    background: #1a1a1a;
    border-radius: 50%;
  }

  /* ─────────────────────────────────────
     SIDE NAV  (vertical text)
     ───────────────────────────────────── */
  .sidenav {
    position: absolute;
    left: -56px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 22px;
    align-items: flex-end;
  }
  /* We'll float sidenav outside grid via the outer wrapper */
  .side-labels {
    position: absolute;
    left: -24px;
    top: 50%;
    transform: translateY(-50%) rotate(-90deg);
    display: flex;
    flex-direction: row;
    gap: 28px;
    white-space: nowrap;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: #888;
    text-transform: uppercase;
    transform-origin: center center;
  }

  /* ─────────────────────────────────────
     HEADER ROW  –  title + top cards
     ───────────────────────────────────── */
  .top-right {
    grid-column: 2 / 4;
    grid-row: 1;
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }

  .portfolio-title {
    font-family: 'Syne', sans-serif;
    font-size: 72px;
    font-weight: 800;
    color: #1a1a1a;
    line-height: 1;
    flex-shrink: 0;
    display: flex;
    align-items: flex-start;
    gap: 4px;
  }
  .portfolio-title .sup-arrow {
    font-size: 28px;
    margin-top: 8px;
    color: #1a1a1a;
  }

  /* ─────────────────────────────────────
     CARD 2  –  Flamingo / Video (center)
     ───────────────────────────────────── */
  .card-video {
    grid-column: 2;
    grid-row: 2;
    background: #7ecdc8;
    border-radius: 24px;
    overflow: hidden;
    position: relative;
    min-height: 260px;
  }

  /* Decorative tropical illustration */
  .card-video .tropical-bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 80% at 60% 70%, #e8f5e0 0%, #b8e8c8 40%, #7ecdc8 100%);
  }

  /* Leaf shapes */
  .leaf {
    position: absolute;
    border-radius: 0 80% 0 80%;
    opacity: 0.85;
  }
  .leaf-1 { width: 100px; height: 160px; background: #2d8c5a; top: -20px; left: -10px; transform: rotate(30deg); }
  .leaf-2 { width: 80px; height: 130px; background: #3aaa6e; top: 10px; left: 30px; transform: rotate(-15deg); border-radius: 80% 0 80% 0; }
  .leaf-3 { width: 90px; height: 140px; background: #1d7248; top: -30px; right: 20px; transform: rotate(-40deg); }
  .leaf-4 { width: 70px; height: 110px; background: #4bbf78; top: 20px; right: 60px; transform: rotate(20deg); border-radius: 0 80% 0 80%; }
  .leaf-5 { width: 110px; height: 60px; background: #f5a9a0; bottom: 0; left: 10px; transform: rotate(-10deg); border-radius: 50%; opacity: 0.6; }

  /* Flamingo body */
  .flamingo {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 220px;
  }
  .flamingo-body {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 90px;
    background: #f08080;
    border-radius: 50% 50% 40% 40%;
  }
  .flamingo-neck {
    position: absolute;
    bottom: 120px;
    left: calc(50% + 8px);
    width: 18px;
    height: 80px;
    background: #f08080;
    border-radius: 20px;
    transform: rotate(-15deg);
    transform-origin: bottom center;
  }
  .flamingo-head {
    position: absolute;
    bottom: 188px;
    left: calc(50% + 4px);
    width: 30px;
    height: 24px;
    background: #f08080;
    border-radius: 50%;
  }
  .flamingo-beak {
    position: absolute;
    bottom: 186px;
    left: calc(50% + 28px);
    width: 20px;
    height: 8px;
    background: #f5c842;
    border-radius: 0 4px 8px 0;
  }
  .flamingo-leg-1, .flamingo-leg-2 {
    position: absolute;
    bottom: 0;
    width: 6px;
    height: 44px;
    background: #f08080;
    border-radius: 3px;
  }
  .flamingo-leg-1 { left: calc(50% - 14px); }
  .flamingo-leg-2 { left: calc(50% + 8px); }

  /* Play button */
  .play-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 52px;
    height: 52px;
    background: rgba(255,255,255,0.85);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
    z-index: 10;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .play-btn:hover { transform: translate(-50%,-50%) scale(1.1); }
  .play-btn svg { margin-left: 3px; }

  /* corner bracket */
  .corner-bracket {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 16px;
    height: 16px;
    border-top: 2.5px solid rgba(255,255,255,0.6);
    border-right: 2.5px solid rgba(255,255,255,0.6);
    border-radius: 0 4px 0 0;
  }
  .corner-bracket-dark {
    border-color: rgba(0,0,0,0.25);
  }

  /* ─────────────────────────────────────
     STAT CARDS  (right column)
     ───────────────────────────────────── */
  .stats-col {
    grid-column: 3;
    grid-row: 1 / 3;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .card-stat {
    background: #b8e8d0;
    border-radius: 20px;
    padding: 20px 22px;
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .card-stat:nth-child(2) { background: #b8a9f8; }
  .card-stat:nth-child(3) { background: #ffd166; flex: 1.3; }

  .card-stat .stat-number {
    font-family: 'Syne', sans-serif;
    font-size: 52px;
    font-weight: 800;
    color: #1a1a1a;
    line-height: 1;
  }
  .card-stat .stat-label {
    font-size: 13px;
    font-weight: 500;
    color: #3a3a3a;
    margin-top: 2px;
  }

  /* ─────────────────────────────────────
     BOTTOM ROW  –  Apple logo + Clients + 172 award
     ───────────────────────────────────── */
  .bottom-row {
    grid-column: 2;
    grid-row: 3;
    display: flex;
    gap: 14px;
    margin-top: 0;
  }

  /* We need a 3rd grid row */
  .grid {
    grid-template-rows: auto auto auto;
  }

  .card-apple {
    flex: 0 0 130px;
    background: #2b2b2b;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 120px;
    position: relative;
  }
  .card-apple svg { width: 44px; height: 52px; fill: white; }

  .card-clients {
    flex: 1;
    background: #2b2b2b;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 120px;
    position: relative;
  }
  .card-clients .label {
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    letter-spacing: 0.03em;
  }

  /* Orb inside clients card */
  .orb {
    position: absolute;
    top: 50%;
    left: 20px;
    transform: translateY(-50%);
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: conic-gradient(from 180deg, #a855f7, #3b82f6, #06b6d4, #a855f7);
    box-shadow: 0 0 20px rgba(168,85,247,0.5);
  }

  /* ─────────────────────────────────────
     AWARD card  (last stat bottom)
     ───────────────────────────────────── */
  .card-award {
    grid-column: 3;
    grid-row: 3;
    background: #ffd166;
    border-radius: 20px;
    padding: 20px 22px;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 120px;
  }
  .card-award .stat-number {
    font-family: 'Syne', sans-serif;
    font-size: 52px;
    font-weight: 800;
    color: #1a1a1a;
    line-height: 1;
  }
  .card-award .stat-label {
    font-size: 12px;
    font-weight: 500;
    color: #3a3a3a;
    line-height: 1.3;
    margin-top: 2px;
  }

  /* ── Shared corner bracket ── */
  .cb {
    position: absolute;
    top: 14px; right: 14px;
    width: 14px; height: 14px;
    border-top: 2px solid rgba(0,0,0,0.25);
    border-right: 2px solid rgba(0,0,0,0.25);
    border-radius: 0 3px 0 0;
  }
  .cb-light {
    border-color: rgba(255,255,255,0.3);
  }

  /* ── Side nav labels (decorative) ── */
  .outer {
    position: relative;
    width: 100%;
    max-width: 1060px;
  }
  .vertical-nav {
    position: absolute;
    left: -40px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 28px;
    align-items: flex-end;
  }
  .vertical-nav span {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    transform: rotate(180deg);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #999;
    cursor: pointer;
    transition: color 0.2s;
  }
  .vertical-nav span:hover { color: #1a1a1a; }
  .vertical-nav span.active { color: #1a1a1a; }
</style>
</head>
<body>

<div class="outer">

  <!-- Vertical side nav -->
  <div class="vertical-nav">
    <span>Clients</span>
    <span>Research</span>
    <span class="active">Portfolio</span>
    <span>Podcast</span>
  </div>

  <div class="grid">

    <!-- ── CARD 1: Profile ── -->
    <div class="card-profile">
      <div class="tag">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="8" cy="8" r="6"/>
          <line x1="8" y1="2" x2="8" y2="8"/>
          <line x1="8" y1="8" x2="12" y2="10"/>
        </svg>
        About Me
      </div>

      <div class="photo-wrap">
        <div class="photo-circle">
          <div class="person">
            <div class="head">
              <div class="glasses"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="greeting">Im,</div>
      <div class="name">
        <span>Jon</span>
        <span>Daniel</span>
      </div>

      <div class="email-row">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="1" y="3" width="14" height="10" rx="2"/>
          <polyline points="1,3 8,9 15,3"/>
        </svg>
        inquiry@jondaniel.design
      </div>

      <!-- Spinning badge -->
      <div class="badge-ring">
        <svg viewBox="0 0 60 60">
          <defs>
            <path id="circle-path" d="M 30,30 m -22,0 a 22,22 0 1,1 44,0 a 22,22 0 1,1 -44,0"/>
          </defs>
          <text font-size="7.5" fill="#1a1a1a" font-family="'DM Sans', sans-serif" letter-spacing="2" font-weight="600">
            <textPath href="#circle-path">2022 DESIGN PORTFOLIO · 2022 ·</textPath>
          </text>
        </svg>
        <div class="center-dot"></div>
      </div>
    </div>

    <!-- ── TOP RIGHT: Title + Stats ── -->
    <div class="top-right">
      <div class="portfolio-title">
        Portfolio<span class="sup-arrow">↗</span>
      </div>
    </div>

    <!-- ── Stats column ── -->
    <div class="stats-col">
      <div class="card-stat">
        <div class="cb"></div>
        <div class="stat-number">251</div>
        <div class="stat-label">Projects</div>
      </div>
      <div class="card-stat">
        <div class="cb"></div>
        <div class="stat-number">156</div>
        <div class="stat-label">Awards</div>
      </div>
    </div>

    <!-- ── CARD 2: Video / Flamingo ── -->
    <div class="card-video">
      <div class="tropical-bg"></div>
      <div class="leaf leaf-1"></div>
      <div class="leaf leaf-2"></div>
      <div class="leaf leaf-3"></div>
      <div class="leaf leaf-4"></div>
      <div class="leaf leaf-5"></div>

      <div class="flamingo">
        <div class="flamingo-leg-1"></div>
        <div class="flamingo-leg-2"></div>
        <div class="flamingo-body"></div>
        <div class="flamingo-neck"></div>
        <div class="flamingo-head"></div>
        <div class="flamingo-beak"></div>
      </div>

      <div class="play-btn">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <polygon points="5,3 15,9 5,15" fill="#1a1a1a"/>
        </svg>
      </div>
    </div>

    <!-- ── BOTTOM ROW: Apple + Clients ── -->
    <div class="bottom-row">
      <div class="card-apple">
        <div class="cb cb-light"></div>
        <!-- Apple logo SVG -->
        <svg viewBox="0 0 170 170" xmlns="http://www.w3.org/2000/svg">
          <path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.197-2.12-9.973-3.17-14.34-3.17-4.58 0-9.492 1.05-14.746 3.17-5.262 2.13-9.501 3.24-12.742 3.35-4.929 0.21-9.842-1.96-14.746-6.52-3.13-2.73-7.045-7.41-11.735-14.04-5.032-7.08-9.169-15.29-12.41-24.65-3.471-10.11-5.211-19.9-5.211-29.378 0-10.857 2.346-20.221 7.045-28.068 3.693-6.303 8.606-11.275 14.755-14.925s12.793-5.51 19.948-5.629c3.915 0 9.049 1.211 15.429 3.591 6.362 2.388 10.447 3.599 12.238 3.599 1.339 0 5.877-1.416 13.57-4.239 7.275-2.617 13.415-3.702 18.445-3.275 13.63 1.1 23.87 6.473 30.68 16.153-12.19 7.386-18.22 17.731-18.1 31.002 0.11 10.337 3.86 18.939 11.23 25.769 3.34 3.17 7.07 5.62 11.22 7.36-0.9 2.61-1.85 5.11-2.86 7.51zM119.11 7.24c0 8.102-2.96 15.667-8.86 22.669-7.12 8.328-15.732 13.134-25.071 12.375-0.119-0.972-0.188-1.995-0.188-3.07 0-7.778 3.386-16.106 9.399-22.907 3.002-3.446 6.82-6.311 11.45-8.597 4.62-2.252 8.99-3.497 13.1-3.71 0.12 1.083 0.17 2.166 0.17 3.24z"/>
        </svg>
      </div>

      <div class="card-clients">
        <div class="cb cb-light"></div>
        <div class="orb"></div>
        <div class="label" style="margin-left: 36px;">Clients</div>
      </div>
    </div>

    <!-- ── Award card (bottom right) ── -->
    <div class="card-award">
      <div class="cb"></div>
      <div class="stat-number">172</div>
      <div class="stat-label">Global Design<br>Awards.</div>
    </div>

  </div><!-- /grid -->
</div><!-- /outer -->

</body>
</html>
