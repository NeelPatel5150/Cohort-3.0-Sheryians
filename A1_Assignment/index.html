<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <section class="poster">
            <div class="poster__left">
                <div class="logo">Pokémon</div>

                <div class="copy">
                    <p class="eyebrow">POKEMON GEN I</p>
                    <h1>Pikachu</h1>
                    <p class="description">
                        Pikachu is an Electric-type Pokémon introduced in Generation I.
                        Pikachu are small, chubby, and incredibly cute mouse-like Pokémon.
                        They are almost completely covered by yellow fur.
                    </p>

                    <div class="pager">
                        <span class="pager__line"></span>
                        <span class="pager__text">01 / 08</span>
                    </div>
                </div>

                <div class="pokeball" aria-hidden="true"></div>
            </div>

            <div class="poster__right">
                <button class="menu" aria-label="Menu" type="button">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>

                <img class="pikachu" src="./Pokemon.png" alt="Pikachu">

                <div class="dots" aria-hidden="true">
                    <span class="dot dot--active"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
