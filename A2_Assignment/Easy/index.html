<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScaleX - Insights & Blogs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-shell">
        <header class="topbar">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">
                    <span></span>
                    <span></span>
                </span>
                <span class="brand-name">ScaleX</span>
            </div>

            <nav class="nav-links" aria-label="Primary">
                <a href="#">Home</a>
                <a href="#">About Us</a>
                <a href="#">Blogs</a>
                <a href="#">Contact Us</a>
            </nav>

            <a class="cta" href="#">Get Started</a>
        </header>

        <main class="hero">
            <p class="eyebrow">Insights</p>
            <h1>Insights &amp; Blogs</h1>

            <div class="filters" aria-label="Blog categories">
                <button class="pill active">All</button>
                <button class="pill">Tech</button>
                <button class="pill">SaaS</button>
                <button class="pill">Marketing</button>
            </div>

            <section class="card-grid" aria-label="Featured blog posts">
                <article class="post-card post-card--martini">
                    <div class="art art-martini" aria-hidden="true">
                        <span class="wall-grid"></span>
                        <span class="glass"></span>
                        <span class="glass-shine"></span>
                        <span class="olive olive-one"></span>
                        <span class="olive olive-two"></span>
                        <span class="skewer"></span>
                    </div>
                    <div class="post-meta">Tech</div>
                    <h2>The Ultimate Guide To SaaS Marketing</h2>
                    <p>May 23, 2025</p>
                </article>

                <article class="post-card post-card--chair">
                    <div class="art art-chair" aria-hidden="true">
                        <span class="chair-back"></span>
                        <span class="chair-seat"></span>
                        <span class="chair-leg chair-leg-left"></span>
                        <span class="chair-leg chair-leg-right"></span>
                        <span class="spotlight"></span>
                    </div>
                    <div class="post-meta">SaaS</div>
                    <h2>5 Key Trends In SaaS Growth For 2025</h2>
                    <p>May 23, 2025</p>
                </article>

                <article class="post-card post-card--cat">
                    <div class="art art-cat" aria-hidden="true">
                        <span class="cat-head"></span>
                        <span class="cat-ear cat-ear-left"></span>
                        <span class="cat-ear cat-ear-right"></span>
                        <span class="cat-eye cat-eye-left"></span>
                        <span class="cat-eye cat-eye-right"></span>
                        <span class="cat-nose"></span>
                        <span class="cat-whisker cat-whisker-left"></span>
                        <span class="cat-whisker cat-whisker-right"></span>
                    </div>
                    <div class="post-meta">Marketing</div>
                    <h2>How Data-Driven Strategies Are Important</h2>
                    <p>May 23, 2025</p>
                </article>
            </section>
        </main>
    </div>
</body>
</html>
